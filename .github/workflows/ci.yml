name: 🚀 JSON_CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: 🚀 Tests + Validators
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v5

      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🚀 Sync dependencies from uv.lock
        run: uv sync --locked --extra dev

      - name: 🚀 Check .gitignore covers __pycache__
        run: uv run python3 shared_validation/tools/check_gitignore_pycache.py

      - name: 🚀 Run unit tests
        run: uv run python3 -m unittest discover -s tests -v

      - name: 🚀 Validate Discovery
        run: uv run python3 discovery/discovery_scripts/discovery_master_validator.py

      - name: 🚀 Validate Encounters
        run: uv run python3 encounters/encounters_scripts/encounters_master_validator.py

      - name: 🔗 Validate README links
        run: uv run python3 devocionales_scripts/generate_stats.py --check-links

      - name: 📊 Auto-update README stats
        if: success() && github.event_name == 'push'
        run: |
          uv run python3 devocionales_scripts/generate_stats.py

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [bot]"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "📊 Update README stats [skip ci]"
            git push
          else
            echo "ℹ️ Stats unchanged — skipping commit"
          fi
