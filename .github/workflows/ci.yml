name: 🚀 JSON_CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: 🚀 Tests + Validators
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v5

      - name: 🚀 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 🚀 Check .gitignore covers __pycache__
        run: python3 shared_validation/check_gitignore_pycache.py

      - name: 🚀 Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: 🚀 Validate Discovery
        run: python3 discovery/discovery_scripts/discovery_master_validator.py

      - name: 🚀 Validate Encounters
        run: python3 encounters/encounters_scripts/encounters_master_validator.py

  validate-scripture:
    name: 🚀 Scripture Validation
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v5

      - name: 🚀 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 🚀 Validate Discovery scripture references
        run: python3 discovery/discovery_scripts/validate_discovery.py --scripture-only

      - name: 🚀 Validate Encounters scripture references
        run: python3 encounters/encounters_scripts/validate_encounters.py --scripture-only
