name: 🚀 JSON_CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: 🚀 Tests + Validators
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v5

      - name: 🚀 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 🚀 Check .gitignore covers __pycache__
        run: python3 shared_validation/check_gitignore_pycache.py

      - name: 🚀 Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: 🚀 Validate Discovery
        run: python3 discovery/discovery_scripts/discovery_master_validator.py

      - name: 🚀 Validate Encounters
        run: python3 encounters/encounters_scripts/encounters_master_validator.py

      - name: 🚀 Validate Discovery cross-file family consistency
        run: |
          python3 -c "
          import json, subprocess, sys
          studies = json.load(open('discovery/index.json'))['studies']
          failed = []
          for s in studies:
              r = subprocess.run(
                  ['python3', 'discovery/discovery_scripts/validate_family.py', s['id']],
                  capture_output=True, text=True,
              )
              if r.returncode != 0:
                  failed.append(s['id'])
                  print(r.stdout)
                  print(r.stderr, file=sys.stderr)
          if failed:
              print(f'FAILED: {len(failed)}/{len(studies)} studies — {failed}')
              sys.exit(1)
          print(f'OK: all {len(studies)} studies passed cross-file validation')
          "

      - name: 🔗 Validate README links
        run: python3 devocionales_scripts/generate_stats.py --check-links

      - name: 📊 Auto-update README stats
        if: success() && github.event_name == 'push'
        run: |
          python3 devocionales_scripts/generate_stats.py

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [bot]"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "📊 Update README stats [skip ci]"
            git push
          else
            echo "ℹ️ Stats unchanged — skipping commit"
          fi

  validate-scripture:
    name: 🚀 Scripture Validation
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Checkout
        uses: actions/checkout@v5

      - name: 🚀 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 🚀 Validate Discovery scripture references
        run: python3 discovery/discovery_scripts/validate_discovery.py --scripture-only

      - name: 🚀 Validate Encounters scripture references
        run: python3 encounters/encounters_scripts/validate_encounters.py --scripture-only
