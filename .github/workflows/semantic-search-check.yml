name: 🔬 Semantic Search Fast Check

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

jobs:
  validate:
    name: 🔬 Semantic embeddings tests
    runs-on: ubuntu-latest
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-intfloat-multilingual-e5-small

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Run semantic search tests only
        run: uv run python3 -m unittest tests.test_semantic_embeddings -v

  # TEMPORARY job for PR #118's ranking-gap investigation. bge-m3 already
  # proved a clean win for the 4 languages with documented gaps (ar, fil,
  # ja, zh — see benchmark_candidate_model.py's docstring: 15/24 -> 19/24,
  # no per-language regression). Before deciding to re-embed the FULL
  # corpus with bge-m3 (simpler than a per-language hybrid setup, but pays
  # its cost for languages that were never broken), this checks bge-m3
  # against the 5 remaining languages that already have ground-truth
  # topic queries and were never flagged as gaps — es/pt/fr/de (Latin
  # script) plus hi — to confirm it doesn't regress languages e5-small
  # already handled well. Remove this job once read.
  benchmark-bge-m3-remaining-languages:
    name: 🔬 EXPERIMENT — bge-m3 regression check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [es, pt, fr, de, hi]
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-candidate-models

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Benchmark bge-m3 for ${{ matrix.language }}
        run: uv run python3 devocionales_scripts/benchmark_candidate_model.py --language ${{ matrix.language }} --model bge-m3

  # PRODUCTION build (not yet committed): re-embeds the FULL corpus with
  # bge-m3, one language per job in parallel so this doesn't take the
  # ~7-8 hours it would sequentially (ar alone took ~2h42m for its
  # ~1460-entry subset in prior benchmarking). Writes each language's
  # shard as a build artifact rather than committing directly — nothing
  # under editorial/semantic_search/ (the current committed baseline) is
  # touched by this job. Once the regression-check job above confirms no
  # per-language regression on es/pt/fr/de/hi, the merge job below
  # combines all 10 shards into one embeddings.bin + manifest.json,
  # uploaded as a final artifact for review before anyone commits it as
  # the new baseline.
  build-bge-m3-shards:
    name: 🏗️ Build bge-m3 shard (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ar, de, en, es, fil, fr, hi, ja, pt, zh]
    steps:
      - name: 🏗️ Checkout
        uses: actions/checkout@v5

      - name: 🏗️ Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🏗️ Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-candidate-models

      - name: 🏗️ Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🏗️ Build bge-m3 shard for ${{ matrix.language }}
        run: |
          uv run python3 devocionales_scripts/build_semantic_embeddings.py \
            --languages ${{ matrix.language }} \
            --model bge-m3 \
            --out-dir shards/${{ matrix.language }}

      - name: 🏗️ Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: bge-m3-shard-${{ matrix.language }}
          path: shards/${{ matrix.language }}
          retention-days: 14

  merge-bge-m3-shards:
    name: 🏗️ Merge bge-m3 shards into full corpus
    runs-on: ubuntu-latest
    needs: build-bge-m3-shards
    steps:
      - name: 🏗️ Checkout
        uses: actions/checkout@v5

      - name: 🏗️ Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🏗️ Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🏗️ Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: bge-m3-shard-*
          path: shards
          merge-multiple: false

      - name: 🏗️ Flatten shard directories
        run: |
          mkdir -p merged-shards
          for lang in ar de en es fil fr hi ja pt zh; do
            mv "shards/bge-m3-shard-$lang" "merged-shards/$lang"
          done

      - name: 🏗️ Merge shards
        run: |
          uv run python3 devocionales_scripts/merge_embedding_shards.py \
            --shards-dir merged-shards \
            --languages ar,de,en,es,fil,fr,hi,ja,pt,zh \
            --out-dir bge-m3-full-corpus

      - name: 🏗️ Upload merged corpus
        uses: actions/upload-artifact@v4
        with:
          name: bge-m3-full-corpus
          path: bge-m3-full-corpus
          retention-days: 14
