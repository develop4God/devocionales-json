name: 🔬 Semantic Search Fast Check

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

jobs:
  validate:
    name: 🔬 Semantic embeddings tests
    runs-on: ubuntu-latest
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-intfloat-multilingual-e5-small

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Run semantic search tests only
        run: uv run python3 -m unittest tests.test_semantic_embeddings -v

  # TEMPORARY job for PR #118's ranking-gap investigation — remove once the
  # candidate-model benchmark results are read and a decision made.
  # e5-base gave a mixed, language-dependent result (see
  # benchmark_e5_base_model.py's docstring): helped fil/zh, badly regressed
  # ar, ~neutral for ja. Testing whether a single newer model (Qwen3-Embedding
  # or BGE-M3) handles all 4 affected languages well instead of needing a
  # per-language hybrid model setup. Runs all (language, model) combinations
  # as parallel matrix jobs — each embeds its ~1460-entry subset twice
  # (small + candidate) and would be slow run sequentially.
  benchmark-candidate-model:
    name: 🔬 EXPERIMENT — candidate model benchmark
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ar, fil, ja, zh]
        model: [qwen3, bge-m3]
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-candidate-models

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Benchmark ${{ matrix.model }} for ${{ matrix.language }}
        run: uv run python3 devocionales_scripts/benchmark_candidate_model.py --language ${{ matrix.language }} --model ${{ matrix.model }}
