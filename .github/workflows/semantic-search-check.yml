name: 🔬 Semantic Search Fast Check

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

jobs:
  validate:
    name: 🔬 Semantic embeddings tests
    runs-on: ubuntu-latest
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-intfloat-multilingual-e5-small

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Run semantic search tests only
        run: uv run python3 -m unittest tests.test_semantic_embeddings -v

      # TEMPORARY experiment step for PR #118's ranking-gap investigation —
      # remove once the multilingual-e5-base benchmark result is read and a
      # decision made. Starting with zh (3 of 9 gaps); will re-run for other
      # languages if this looks promising.
      - name: 🔬 EXPERIMENT — multilingual-e5-base benchmark (zh)
        run: uv run python3 devocionales_scripts/benchmark_e5_base_model.py --language zh
