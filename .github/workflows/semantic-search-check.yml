name: 🔬 Semantic Search Fast Check

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

jobs:
  validate:
    name: 🔬 Semantic embeddings tests
    runs-on: ubuntu-latest
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-intfloat-multilingual-e5-small

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Run semantic search tests only
        run: uv run python3 -m unittest tests.test_semantic_embeddings -v

  # TEMPORARY job for PR #118's ranking-gap investigation. bge-m3 already
  # proved a clean win for the 4 languages with documented gaps (ar, fil,
  # ja, zh — see benchmark_candidate_model.py's docstring: 15/24 -> 19/24,
  # no per-language regression). Before deciding to re-embed the FULL
  # corpus with bge-m3 (simpler than a per-language hybrid setup, but pays
  # its cost for languages that were never broken), this checks bge-m3
  # against the 5 remaining languages that already have ground-truth
  # topic queries and were never flagged as gaps — es/pt/fr/de (Latin
  # script) plus hi — to confirm it doesn't regress languages e5-small
  # already handled well. Remove this job once read.
  benchmark-bge-m3-remaining-languages:
    name: 🔬 EXPERIMENT — bge-m3 regression check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [es, pt, fr, de, hi]
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-candidate-models

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Benchmark bge-m3 for ${{ matrix.language }}
        run: uv run python3 devocionales_scripts/benchmark_candidate_model.py --language ${{ matrix.language }} --model bge-m3
