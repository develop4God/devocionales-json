name: 🔬 Semantic Search Fast Check

on:
  workflow_dispatch:

jobs:
  validate:
    name: 🔬 Semantic embeddings tests
    runs-on: ubuntu-latest
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-intfloat-multilingual-e5-small

      - name: 🔬 Install package (editable)
        run: pip install -e .

      - name: 🔬 Run semantic search tests only
        run: python3 -m unittest tests.test_semantic_embeddings -v
