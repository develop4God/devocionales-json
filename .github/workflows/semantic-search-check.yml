name: 🔬 Semantic Search Fast Check

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

jobs:
  validate:
    name: 🔬 Semantic embeddings tests
    runs-on: ubuntu-latest
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-intfloat-multilingual-e5-small

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Run semantic search tests only
        run: uv run python3 -m unittest tests.test_semantic_embeddings -v

  # DEEP-DIVE follow-up to the single-query-per-topic regression check
  # (which used exactly 1 single-word + 1 multi-sentence query per topic
  # and found fr 6/6->5/6, de 5/6->4/6 — see benchmark_candidate_model.py's
  # docstring). Before accepting or rejecting that as a real regression,
  # run many additional synonym/rephrasing queries per topic against the
  # same expected verses, broken down by single-word vs multi-word, so a
  # narrow phrasing-specific miss isn't mistaken for a systemic model
  # weakness. Companion job below does the same for the 4 languages that
  # improved (ar/fil/ja/zh), to confirm that win is equally robust.
  deep-dive-fr-de-regression:
    name: 🔬 DEEP-DIVE — fr/de regression check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [fr, de]
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-candidate-models

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Deep-dive bge-m3 vs small for ${{ matrix.language }}
        run: uv run python3 devocionales_scripts/benchmark_fr_de_deep_dive.py --language ${{ matrix.language }}

  deep-dive-gap-languages-improvement:
    name: 🔬 DEEP-DIVE — gap-language improvement check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ar, fil, ja, zh]
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-candidate-models

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Deep-dive bge-m3 vs small for ${{ matrix.language }}
        run: uv run python3 devocionales_scripts/benchmark_gap_languages_deep_dive.py --language ${{ matrix.language }}

  # PRODUCTION build (already validated once — see PR #118 discussion: the
  # full-corpus bge-m3 build succeeded, 13,870 entries, 1024-dim, uploaded
  # as artifact bge-m3-full-corpus on a prior run of this workflow).
  # Re-embeds the FULL corpus with bge-m3, one language per job in
  # parallel so this doesn't take the ~7-8 hours it would sequentially
  # (ar alone took ~2h42m for its ~1460-entry subset in prior
  # benchmarking). Writes each language's shard as a build artifact rather
  # than committing directly — nothing under editorial/semantic_search/
  # (the current committed baseline) is touched by this job.
  build-bge-m3-shards:
    name: 🏗️ Build bge-m3 shard (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ar, de, en, es, fil, fr, hi, ja, pt, zh]
    steps:
      - name: 🏗️ Checkout
        uses: actions/checkout@v5

      - name: 🏗️ Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🏗️ Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-candidate-models

      - name: 🏗️ Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🏗️ Build bge-m3 shard for ${{ matrix.language }}
        run: |
          uv run python3 devocionales_scripts/build_semantic_embeddings.py \
            --languages ${{ matrix.language }} \
            --model bge-m3 \
            --out-dir shards/${{ matrix.language }}

      - name: 🏗️ Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: bge-m3-shard-${{ matrix.language }}
          path: shards/${{ matrix.language }}
          retention-days: 14

  merge-bge-m3-shards:
    name: 🏗️ Merge bge-m3 shards into full corpus
    runs-on: ubuntu-latest
    needs: build-bge-m3-shards
    steps:
      - name: 🏗️ Checkout
        uses: actions/checkout@v5

      - name: 🏗️ Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🏗️ Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🏗️ Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: bge-m3-shard-*
          path: shards
          merge-multiple: false

      - name: 🏗️ Flatten shard directories
        run: |
          mkdir -p merged-shards
          for lang in ar de en es fil fr hi ja pt zh; do
            mv "shards/bge-m3-shard-$lang" "merged-shards/$lang"
          done

      - name: 🏗️ Merge shards
        run: |
          uv run python3 devocionales_scripts/merge_embedding_shards.py \
            --shards-dir merged-shards \
            --languages ar,de,en,es,fil,fr,hi,ja,pt,zh \
            --out-dir bge-m3-full-corpus

      - name: 🏗️ Upload merged corpus
        uses: actions/upload-artifact@v4
        with:
          name: bge-m3-full-corpus
          path: bge-m3-full-corpus
          retention-days: 14
