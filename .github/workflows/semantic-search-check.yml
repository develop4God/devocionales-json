name: 🔬 Semantic Search Fast Check

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

jobs:
  validate:
    name: 🔬 Semantic embeddings tests
    runs-on: ubuntu-latest
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-BAAI-bge-m3

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Run semantic search tests only
        run: uv run python3 -m unittest tests.test_semantic_embeddings -v

  # DEEP-DIVE follow-up to the single-query-per-topic regression check
  # (which used exactly 1 single-word + 1 multi-sentence query per topic
  # and found fr 6/6->5/6, de 5/6->4/6 — see benchmark_candidate_model.py's
  # docstring). Before accepting or rejecting that as a real regression,
  # run many additional synonym/rephrasing queries per topic against the
  # same expected verses, broken down by single-word vs multi-word, so a
  # narrow phrasing-specific miss isn't mistaken for a systemic model
  # weakness. Companion job below does the same for the 4 languages that
  # improved (ar/fil/ja/zh), to confirm that win is equally robust.
  #
  # Downloads the bge-m3 shard already built and uploaded by an earlier
  # run of this workflow (run 34747384632, languages built there:
  # ar/de/en/es/fil/fr/hi/ja/pt/zh) instead of re-embedding the corpus —
  # only the query text needs encoding fresh, so this takes seconds per
  # language instead of tens of minutes.
  deep-dive-fr-de-regression:
    name: 🔬 DEEP-DIVE — fr/de regression check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [fr, de]
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-candidate-models

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Download precomputed bge-m3 shard for ${{ matrix.language }}
        uses: actions/download-artifact@v4
        with:
          name: bge-m3-shard-${{ matrix.language }}
          path: bge-m3-shard-${{ matrix.language }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34747384632

      - name: 🔬 Deep-dive bge-m3 vs small for ${{ matrix.language }}
        run: |
          uv run python3 devocionales_scripts/benchmark_fr_de_deep_dive.py \
            --language ${{ matrix.language }} \
            --bge-m3-dir bge-m3-shard-${{ matrix.language }}

  deep-dive-gap-languages-improvement:
    name: 🔬 DEEP-DIVE — gap-language improvement check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ar, fil, ja, zh]
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 🔬 Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-candidate-models

      - name: 🔬 Sync dependencies from uv.lock
        run: uv sync --locked

      - name: 🔬 Download precomputed bge-m3 shard for ${{ matrix.language }}
        uses: actions/download-artifact@v4
        with:
          name: bge-m3-shard-${{ matrix.language }}
          path: bge-m3-shard-${{ matrix.language }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34747384632

      - name: 🔬 Deep-dive bge-m3 vs small for ${{ matrix.language }}
        run: |
          uv run python3 devocionales_scripts/benchmark_gap_languages_deep_dive.py \
            --language ${{ matrix.language }} \
            --bge-m3-dir bge-m3-shard-${{ matrix.language }}

  # PRODUCTION build already validated — see PR #118 discussion: the
  # full-corpus bge-m3 build succeeded on workflow run 34747384632
  # (13,870 entries, 1024-dim, artifact "bge-m3-full-corpus", still valid
  # until 2026-09-27). Not re-running the build/merge here on every push —
  # it costs ~2-3 hours (ar alone took ~2h42m for its ~1460-entry subset)
  # and the deep-dive jobs above already reuse that same run's per-language
  # shards directly. Re-add a build-bge-m3-shards + merge-bge-m3-shards
  # pair (see git history for the exact steps) only if the corpus content
  # changes and the embeddings need regenerating.
  #
  # One-off: promote the already-validated bge-m3 build to be the committed
  # baseline, replacing e5-small. Downloads the "bge-m3-full-corpus"
  # artifact from run 34747384632 (the sandbox that drives this workflow
  # can't reach GitHub's artifact storage directly — see PR #118
  # discussion) and commits it over editorial/semantic_search/. Remove this
  # job once it has run once and the commit lands; it's not meant to run on
  # every push.
  promote-bge-m3-baseline:
    name: 🔬 Promote bge-m3 full-corpus build to committed baseline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔬 Checkout
        uses: actions/checkout@v5

      - name: 🔬 Download bge-m3 full-corpus artifact
        uses: actions/download-artifact@v4
        with:
          name: bge-m3-full-corpus
          path: editorial/semantic_search
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34747384632

      - name: 🔬 Verify artifact contents
        run: |
          test -f editorial/semantic_search/embeddings.bin
          test -f editorial/semantic_search/manifest.json
          python3 -c "
          import json
          m = json.load(open('editorial/semantic_search/manifest.json'))
          size = __import__('os').path.getsize('editorial/semantic_search/embeddings.bin')
          assert size == len(m) * 1024 * 4, f'size mismatch: {size} != {len(m)*1024*4}'
          print(f'OK: {len(m)} entries, 1024-dim')
          "

      - name: 🔬 Commit and push new baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add editorial/semantic_search/embeddings.bin editorial/semantic_search/manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Promote bge-m3 full-corpus build to committed semantic search baseline" \
              -m "Replaces intfloat/multilingual-e5-small with BAAI/bge-m3 (13,870 entries, 1024-dim). Deep-dive testing with expanded single-word and multi-sentence query sets confirmed bge-m3 wins on every language, including fr/de which had looked regressed under a single query per topic (fr 55.0%->70.0%, de 60.0%->65.0%; ar/fil/ja/zh improvements reconfirmed). No per-language hybrid needed."
            git push origin HEAD:${{ github.ref_name }}
          fi
