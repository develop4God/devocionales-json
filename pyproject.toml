[project]
name = "devocionales-json"
version = "0.1.0"
description = "Content, validation, and generation pipelines for devocionales-json (Devotionals, Discovery, Encounters)."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared_validation*", "devocionales_scripts*"]
